name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-package:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public development contract
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Run credential-free demo
        run: python -m pdhg_benchmarks.demo --config configs/demo/cs_tiny.yaml
      - name: Rebuild and check deterministic evidence
        run: python -m pdhg_benchmarks.evidence --build
      - name: Verify deterministic tree
        run: git diff --exit-code
      - name: Validate evidence
        run: python -m pdhg_benchmarks.evidence --check
      - name: Scan publication candidate
        run: python scripts/check_publication.py
