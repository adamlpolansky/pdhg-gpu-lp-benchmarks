[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdhg-gpu-lp-benchmarks"
version = "0.1.0"
description = "Curated, credential-free evidence and demos for GPU/CPU linear-programming benchmarks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Adam Polanský" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]
gurobi = ["gurobipy==13.0.2"]

[project.scripts]
pdhg-bench-demo = "pdhg_benchmarks.demo:main"
pdhg-evidence = "pdhg_benchmarks.evidence:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
